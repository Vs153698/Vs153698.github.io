name: Build and publish site

# The repo's Pages source is "branch: main /", so main must contain the
# built static site. Source code lives on `dev`; this workflow builds it
# and publishes ./out to main. Edit the site on `dev` — never on main.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build --turbopack
      - name: Publish ./out to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: main
          force_orphan: true
