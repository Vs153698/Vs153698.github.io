<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3dd" />
      <stop offset="100%" stop-color="#007ba7" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5ca8" />
      <stop offset="100%" stop-color="#ff2d95" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Tech Frame -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0d0d12" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  
  <!-- Subtle Internal Tech Grid / Glow -->
  <rect x="6" y="6" width="88" height="88" rx="22" stroke="url(#cyanGrad)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- KINETIC "K" STEM (Cyan) -->
  <path d="M 28 22 L 38 22 L 38 78 L 28 78 Z" fill="url(#cyanGrad)" filter="url(#cyanGlow)" rx="4" />
  
  <!-- KINETIC TOP CHEVRON (Rose) -->
  <path d="M 40 50 L 66 24 C 68 22 72 23 74 25 L 75 26 C 77 28 76 32 74 34 L 52 56 Z" fill="url(#roseGrad)" filter="url(#roseGlow)" />
  
  <!-- KINETIC BOTTOM CHEVRON (Cyan) -->
  <path d="M 42 46 L 68 72 C 70 74 74 74 76 72 L 77 71 C 79 69 79 65 77 63 L 55 41 Z" fill="url(#cyanGrad)" filter="url(#cyanGlow)" />

  <!-- INTELLIGENCE "Q" PULSE NODE -->
  <circle cx="76" cy="74" r="5" fill="#ff2d95" filter="url(#roseGlow)" />
  <circle cx="76" cy="74" r="2.5" fill="#ffffff" />
</svg>
